services:
  app:
    build: ./app
    volumes:
      - app:/app/data
    networks:
      - labnet
  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - labnet
networks:
  labnet:
volumes:
  app:
